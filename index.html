<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viajar — Reservas de Viagem</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app">

    <header class="brand">
        <img src="assets/brand-banner.png" alt="Viajar - Reservas de Viagem" class="brand-logo">
    </header>

    <main class="panels">

        <!-- CHAT -->
        <section class="card card-chat" aria-labelledby="chatTitle">
            <div class="card-header">
                <h1 id="chatTitle" class="card-title">Planeje sua viagem</h1>
                <p class="card-subtitle">Responda às perguntas abaixo para montar sua reserva.</p>
            </div>

            <div id="chat" class="chat" aria-live="polite"></div>

            <div class="chat-form">
                <label for="input" class="sr-only">Sua resposta</label>
                <input type="text" id="input" placeholder="Digite sua resposta..." autocomplete="off" />
                <button id="btnEnviar" type="button">
                    Enviar
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                </button>
            </div>
        </section>

        <!-- RESUMO -->
        <section class="card card-resumo" aria-labelledby="resumoTitle">
            <div class="card-header card-header-resumo">
                <div class="card-header-info">
                    <img src="assets/icon-reservation.png" alt="" class="icon-reserva">
                    <div>
                        <h2 id="resumoTitle" class="card-title">Sua Reserva</h2>
                        <p class="card-subtitle">As informações aparecerão conforme você responder.</p>
                    </div>
                </div>

                <button id="btnReiniciar" class="btn-ghost" type="button">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M8 16H3v5"/></svg>
                    Reiniciar
                </button>
            </div>

            <p class="resumo-empty" id="resumoEmpty">Os detalhes da sua viagem serão exibidos aqui.</p>

            <div class="resumo-list">
                <div class="resumo-item">Destino: <span id="r0"></span></div>
                <div class="resumo-item">Pessoas: <span id="r1"></span></div>
                <div class="resumo-item">Assento: <span id="r2"></span></div>
                <div class="resumo-item">Dia: <span id="r3"></span></div>
                <div class="resumo-item">Pacote: <span id="r4"></span></div>
            </div>
        </section>

    </main>
</div>

<!-- 🔥 IMPORTANTE: apenas esse script -->
<script type="module" src="script.js"></script>

</body>
</html>
